%YAML:1.0
# EXACT VINS-Mono upstream TUM profile (HKUST-Aerial-Robotics/VINS-Mono
# config/tum/tum_config.yaml @ 90dabb5e), split across our tracker/estimator
# adapters. Tracker half below; see tum_vi_room1_vio_upstream.yaml for the
# estimator half. Kept SEPARATE from the official-kalibr profile (gate
# decision D): two profiles, both run, never merged.
image_topic: /cam0/image_raw
imu_topic: /imu0
max_cnt: 150
min_dist: 25
image_width: 512
image_height: 512
freq: 10
F_threshold: 1.0
show_track: 0
equalize: 1
fisheye: 1

model_type: KANNALA_BRANDT
camera_name: camera
projection_parameters:
   k2: 0.0034823894022493434
   k3: 0.0007150348452162257
   k4: -0.0020532361418706202
   k5: 0.00020293673591811182
   mu: 190.97847715128717
   mv: 190.9733070521226
   u0: 254.93170605935475
   v0: 256.8974428996504
